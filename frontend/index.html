<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060B1A" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sn_theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F4F1E8");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Sales Nebula — Sales CRM for teams that close</title>
  <meta name="description" content="Sales Nebula is a modern sales CRM for pipeline, accounts, quoting, and service — built for revenue teams that want clarity from first touch to renewal." />
  <link rel="canonical" href="https://salesnebula.com/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sales Nebula" />
  <meta property="og:title" content="Sales Nebula — Sales CRM for teams that close" />
  <meta property="og:description" content="Pipeline, people, quotes, and service in one CRM workspace. Request access or try the demo." />
  <meta property="og:url" content="https://salesnebula.com/" />
  <meta property="og:image" content="/og.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:description" content="The sales CRM that keeps every deal moving. Pipeline, quoting, and service in one workspace." />
  <meta name="twitter:image" content="/og.svg" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

</head>

</body>
</html>
