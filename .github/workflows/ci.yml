name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sales_nebula_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sales_nebula_test?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-only-session-key-not-used-outside-disposable-tests
      TEST_SCHEMA_READY: 'true'
      TEST_DELETE_CLEANUP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npx playwright install --with-deps chromium
      - name: Verify production migrations and schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          node scripts/check-prisma-fields.js src prisma/seed.js scripts
      - name: Backend tests
        run: node scripts/test.js --forceExit --testTimeout=90000
      - name: Build public pages and application
        run: npm --prefix frontend run build
      - name: Public browser journeys
        run: npx playwright test --config playwright.landing.config.js
      - name: Authenticated browser journeys
        run: npx playwright test
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
